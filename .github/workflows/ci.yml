name: Checks and Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run test:parity
      - run: npm run test:soak
      - run: npm run eval
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: checks-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:smoke
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/smoke.mjs --packaged
      - name: Exercise the packaged desktop through the chat, tools and QQ setup screens
        run: |
          node scripts/test-tool-journey.mjs --archive release/win-unpacked/resources/app.asar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-qq-chat.mjs --archive release/win-unpacked/resources/app.asar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-persona-journey.mjs --archive release/win-unpacked/resources/app.asar
        shell: pwsh
      - name: Install on fresh Windows, configure the model, chat and uninstall
        shell: pwsh
        run: ./scripts/test-installed.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: ChatDS-Windows-x64
          path: |
            release/*.exe
            release/*.zip
            test-results/smoke*.json*
            test-results/smoke*.png
            test-results/tool-journey.json
            test-results/qq-journey-*/report.json
            test-results/persona-journey-*/report.json
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run sandbox:build
      - run: node scripts/test-sandbox.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sandbox-result
          path: test-results/sandbox-*.json
  prerelease:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta.')
    needs: [core, desktop, sandbox]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: ChatDS-Windows-x64
          path: artifacts
      - name: Publish tested Windows binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          [[ "$TAG" == "v$version" && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          cd artifacts/release
          installer="ChatDS-$version-x64.exe"
          archive="ChatDS-$version-x64.zip"
          sha256sum "$installer" "$archive" > SHA256SUMS.txt
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [[ "$draft" == "false" ]]; then exit 0; fi
          if [[ "$draft" != "true" ]]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
              --title "ChatDS Desktop $version" --notes-file "$GITHUB_WORKSPACE/docs/beta-notes.md"
          fi
          gh release upload "$TAG" "$installer" "$archive" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
