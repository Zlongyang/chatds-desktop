name: Checks and Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run test:parity
      - run: npm run test:soak
      - run: npm run eval
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: checks-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:smoke
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/smoke.mjs --packaged
      - uses: actions/upload-artifact@v6
        with:
          name: ChatDS-Windows-x64
          path: |
            release/*.exe
            release/*.zip
            test-results/smoke*.json*
            test-results/smoke*.png
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run sandbox:build
      - run: node scripts/test-sandbox.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sandbox-result
          path: test-results/sandbox-*.json
